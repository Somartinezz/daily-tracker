<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Tracker · Ingresar</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

    body {
      font-family: 'DM Sans', sans-serif;
      background: #1c1a17;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
    }

    /* Marca */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-label {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6a6460;
      margin-bottom: 10px;
    }

    .brand-titulo {
      font-family: 'Lora', serif;
      font-size: 2rem;
      font-weight: 600;
      color: #f0ede6;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 0.82rem;
      color: #6a6460;
      font-weight: 300;
      margin-top: 6px;
    }

    /* Card */
    .card {
      background: #242220;
      border: 1px solid #2e2b27;
      border-radius: 14px;
      padding: 36px 32px;
    }

    .card-titulo {
      font-family: 'Lora', serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: #f0ede6;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 0.82rem;
      color: #6a6460;
      font-weight: 300;
      margin-bottom: 28px;
    }

    /* Campos */
    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #8a8070;
      margin-bottom: 7px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #1c1a17;
      border: 1.5px solid #3a3830;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      color: #f0ede6;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #c4783a;
    }

    input::placeholder { color: #4a4640; }

    /* Botón */
    .btn-login {
      width: 100%;
      padding: 13px;
      background: #c4783a;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.01em;
    }

    .btn-login:hover { background: #b36830; transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { background: #4a3828; color: #7a6858; cursor: default; transform: none; }

    /* Error */
    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(192,57,43,0.12);
      border: 1px solid rgba(192,57,43,0.3);
      border-radius: 7px;
      font-size: 0.83rem;
      color: #e07060;
      margin-top: 14px;
    }

    .error-msg.visible { display: flex; }

    /* Loading spinner */
    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: #4a4640;
    }
  </style>
</head>
<body>

<div class="login-wrap">

  <div class="brand">
    <div class="brand-label">Grupo Cepas · IT</div>
    <div class="brand-titulo">Daily Tracker</div>
    <div class="brand-sub">Gestión de tareas y equipos</div>
  </div>

  <div class="card">
    <div class="card-titulo">Bienvenida, Sofi</div>
    <div class="card-sub">Ingresá tus credenciales para continuar.</div>

    <form id="form-login" autocomplete="off">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="tu usuario" autocomplete="username" />
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-login" id="btn-login">
        <span id="btn-texto">Ingresar</span>
        <div class="spinner" id="spinner"></div>
      </button>

      <div class="error-msg" id="error-msg">
        <span>⚠</span>
        <span id="error-texto">Usuario o contraseña incorrectos.</span>
      </div>
    </form>
  </div>

  <div class="login-footer">Daily Tracker · Grupo Cepas © 2025</div>
</div>

<script>
  const form = document.getElementById('form-login');
  const btnTexto = document.getElementById('btn-texto');
  const spinner = document.getElementById('spinner');
  const errorMsg = document.getElementById('error-msg');
  const errorTexto = document.getElementById('error-texto');
  const btn = document.getElementById('btn-login');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const usuario = document.getElementById('usuario').value.trim();
    const password = document.getElementById('password').value;

    if (!usuario || !password) {
      mostrarError('Completá usuario y contraseña.');
      return;
    }

    /* Loading state */
    btn.disabled = true;
    btnTexto.style.display = 'none';
    spinner.style.display = 'block';
    errorMsg.classList.remove('visible');

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password })
      });
      const data = await res.json();

      if (res.ok && data.ok) {
        window.location.href = '/';
      } else {
        mostrarError(data.error || 'Usuario o contraseña incorrectos.');
      }
    } catch {
      mostrarError('Error de conexión. Intentá de nuevo.');
    } finally {
      btn.disabled = false;
      btnTexto.style.display = 'block';
      spinner.style.display = 'none';
    }
  });

  function mostrarError(msg) {
    errorTexto.textContent = msg;
    errorMsg.classList.add('visible');
  }

  /* Limpiar error al tipear */
  document.getElementById('usuario').addEventListener('input', () => errorMsg.classList.remove('visible'));
  document.getElementById('password').addEventListener('input', () => errorMsg.classList.remove('visible'));

  /* Enter en usuario pasa al password */
  document.getElementById('usuario').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('password').focus(); }
  });
</script>
</body>
</html>
